services:
  ops_lab:
    # hostname: ops_lab
    container_name: ops_lab
    image: ops_lab
    privileged: true
    working_dir: /apps/dev
    build:
      context: .
      dockerfile: Dockerfile
    # user: lab_user
    # user: "0:0" 
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    command:
      - /bin/bash
      - -c
      - |
        tail -f
    volumes:
      - ./ops-framework:/repo/ops-framework
      - ./project-sample:/apps/dev/project-sample

  artifactory:
    build: ./artifactory
    container_name: artifactory
    ports:
      - "8082:8082"
    volumes:
      - ./artifactory:/app

  python27:
    image: python:2.7
    container_name: python27
    working_dir: /app
    command:
      - /bin/bash
      - -c
      - |
        tail -f
    volumes:
      - ./ops-framework:/repo/ops-framework
      - ./project-sample:/apps/dev/project-sample

  ubuntu_nopython:
    image: ubuntu:22.04
    container_name: ubuntu_nopython
    working_dir: /app
    command:
      - /bin/bash
      - -c
      - |
        tail -f
    volumes:
      - ./ops-framework:/repo/ops-framework
      - ./project-sample:/apps/dev/project-sample

